  servlet:
    context-path: /api

spring:
  application:
    name: peson-design-admin
  
  # 数据源配置
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://db.thuzbnairklrqmlqmazg.supabase.co:5432/postgres?sslmode=require
    username: postgres
    password: Wang*()0981
  
  # Redis 配置
  data:
    redis:
      host: unique-gannet-78518.upstash.io
      port: 6379
      username: default
      password: gQAAAAAAATK2AAIncDFhYzMzNGI0ZDY4Nzg0YThjOGZkMDE2N2IwZTNhNjE3OHAxNzg1MTg
      ssl:
        enabled: true
      database: 0
      lettuce:
        pool:
          max-active: 8
          max-wait: -1ms
          max-idle: 8
          min-idle: 0
      timeout: 5000ms
  
  # 文件上传配置
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB
  
  # Jackson 配置
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss

# MyBatis-Plus 配置
mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.peson.admin.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# 日志配置
logging:
  level:
    root: INFO
    com.peson.admin: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'

# 自定义配置
peson:
  auth:
    # 登录 token 过期小时数
    token-ttl-hours: 168
    # token key 前缀
    token-prefix: "login:token:"
  upload:
    # 文件上传路径
    path: ./upload/
    # 允许的文件后缀
    allowedExtensions: jpg,jpeg,png,gif,bmp,webp,pdf,doc,docx,xls,xlsx,zip,rar
    # 文件大小限制（字节）
    maxSize: 10485760
